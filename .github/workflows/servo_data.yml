name: Get Servo Saver Data

on:
  schedule:
    - cron: '15 8,20 * * *'
  workflow_dispatch:

jobs:
  servo_data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run get_servo_saver.py
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVO_SAVER_API: ${{ secrets.SERVO_SAVER_API }}
        working-directory: data/servo_saver
        run: python get_servo_saver.py
